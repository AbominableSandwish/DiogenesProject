name: Unity Tests

on:
  push:
    branches:
      - main
      - feature
      - "feature/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          unityVersion: 6000.4.3f1
          artifactsPath: artifacts

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

      - name: Merge feature into main
        if: success() && (github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"

          git fetch origin main "$CURRENT_BRANCH"
          git checkout main
          git pull origin main

          git merge "origin/$CURRENT_BRANCH" --no-ff -m "Auto-merge $CURRENT_BRANCH into main"
          git push origin main
